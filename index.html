<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>GeriKazanım — Maya Okulları</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg:#0d1117; --surface:#161b22; --green:#3fb950; --text:#e6edf3; --border:#30363d; }
        body { font-family: sans-serif; background:var(--bg); color:var(--text); text-align:center; padding:20px; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; max-width:500px; margin:auto; }
        .rank-item { display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid var(--border); }
        .btn { background:var(--green); color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; width:100%; margin-top:10px; font-weight:bold; }
        input { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid var(--border); background:#0d1117; color:white; }
        .pg { display:none; } .on { display:block; }
    </style>
</head>
<body>

    <h2 style="color:var(--green); margin-bottom:20px;">♻️ Maya GeriKazanım</h2>

    <div id="pgLogin" class="pg on">
        <div class="card">
            <h3>Sınıf Seçin</h3>
            <div id="classGrid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;"></div>
            <button class="btn" style="background:#21262d; margin-top:20px;" onclick="openLogin('ADMIN')">⚙️ Yönetici</button>
        </div>
    </div>

    <div id="pgPw" class="pg">
        <div class="card">
            <h3 id="pwTitle">Giriş</h3>
            <input type="password" id="pwIn" placeholder="Şifre">
            <button class="btn" onclick="checkPw()">Giriş Yap</button>
            <button class="btn" style="background:none;" onclick="showPg('login')">Geri</button>
        </div>
    </div>

    <div id="pgRank" class="pg">
        <div class="card">
            <h3>🏆 Liderlik Tablosu</h3>
            <div id="rankList"></div>
            <button class="btn" onclick="showPg('login')">Ana Menü</button>
        </div>
    </div>

    <div id="pgScan" class="pg">
        <div class="card">
            <h3 id="scanTitle">Barkod Kaydı</h3>
            <input type="text" id="bcIn" placeholder="Barkod Numarasını Yazın">
            <button class="btn" onclick="sendToAdmin()">ONAYA GÖNDER</button>
            <button class="btn" style="background:#f85149;" onclick="showPg('login')">Çıkış</button>
        </div>
    </div>

    <div id="pgAdmin" class="pg">
        <div class="card">
            <h3>Onay Bekleyen Kayıtlar</h3>
            <div id="adminList"></div>
            <button class="btn" style="background:#f85149;" onclick="showPg('login')">Çıkış</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBmkMyRIBgih2b4nHqA0sVOz7j0m54shbc",
            databaseURL: "https://gerikazanim-90377-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        // SINIFLARDA "/" YERİNE "-" KULLANDIK (Kritik Düzeltme)
        const CLASSES = {
            '5-A': 'maya5A', '5-B': 'maya5B', '6-A': 'maya6A', '6-B': 'maya6B',
            '7-A': 'maya7A', '7-B': 'maya7B', 'ADMIN': 'MayaAdmin2026'
        };

        let selected = "";
        let currentClass = "";

        // SIRALAMA TAKİBİ
        db.ref('scores').on('value', (s) => {
            const data = s.val() || {};
            const list = document.getElementById('rankList');
            let arr = Object.keys(CLASSES).filter(c => c !== 'ADMIN').map(c => ({name: c, score: data[c] || 0}));
            arr.sort((a,b) => b.score - a.score);
            list.innerHTML = arr.map((x, i) => `
                <div class="rank-item">
                    <span>#${i+1} ${x.name}</span>
                    <span style="color:var(--green); font-weight:bold;">${x.score} Puan</span>
                </div>`).join('');
        });

        // ADMIN ONAY TAKİBİ
        db.ref('approvals').on('value', (s) => {
            const data = s.val() || {};
            const list = document.getElementById('adminList');
            list.innerHTML = Object.entries(data).map(([id, item]) => `
                <div style="padding:10px; border:1px solid var(--border); margin-bottom:10px;">
                    <p>${item.cls} - ${item.bc}</p>
                    <button class="btn" onclick="approve('${id}', '${item.cls}')">Onayla (+5)</button>
                </div>`).join('');
        });

        function build() {
            const g = document.getElementById('classGrid');
            Object.keys(CLASSES).forEach(c => {
                if(c === 'ADMIN') return;
                const b = document.createElement('button');
                b.className = 'btn'; b.style.background = "#21262d";
                b.innerText = c; b.onclick = () => openLogin(c);
                g.appendChild(b);
            });
        }

        function openLogin(c) { selected = c; showPg('pw'); document.getElementById('pwTitle').innerText = c + " Girişi"; }
        
        function checkPw() {
            if(document.getElementById('pwIn').value === CLASSES[selected]) {
                if(selected === 'ADMIN') showPg('admin');
                else { currentClass = selected; showPg('scan'); document.getElementById('scanTitle').innerText = currentClass + " Kaydı"; }
                document.getElementById('pwIn').value = "";
            } else { alert("Yanlış Şifre!"); }
        }

        function showPg(id) {
            document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
            document.getElementById('pg' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('on');
            if(id === 'login') { // Ana menüdeyken de sıralamayı görsünler istersen bunu kullanabilirsin
                showPg('rank'); 
            }
        }

        function sendToAdmin() {
            const bc = document.getElementById('bcIn').value;
            if(!bc) return alert("Barkod gir!");
            db.ref('approvals').push({ cls: currentClass, bc: bc }).then(() => {
                alert("Onaya gönderildi!");
                document.getElementById('bcIn').value = "";
            });
        }

        function approve(id, cls) {
            db.ref('scores/' + cls).transaction(c => (c || 0) + 5).then(() => db.ref('approvals/' + id).remove());
        }

        build();
    </script>
</body>
</html>
