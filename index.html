<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeriKazanım — Maya Okulları</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg:#0d1117; --surface:#161b22; --green:#3fb950; --text:#e6edf3; --border:#30363d; --red:#f85149; }
        body { font-family: sans-serif; background:var(--bg); color:var(--text); text-align:center; padding:20px; margin:0; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; max-width:500px; margin:20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .rank-item { display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid var(--border); align-items:center; }
        .btn { background:var(--green); color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; width:100%; margin-top:10px; font-weight:bold; transition: 0.2s; }
        .btn:disabled { background:#21262d; color:#7d8590; cursor: not-allowed; }
        input { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid var(--border); background:#0d1117; color:white; box-sizing: border-box; }
        .pg { display:none; } .on { display:block; }
        .class-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
        .img-preview { width:100%; border-radius:8px; margin-top:10px; display:none; border: 2px solid var(--green); }
        .admin-img { width:100%; border-radius:8px; margin-top:10px; cursor: pointer; display:none; border: 1px solid var(--border); }
        .admin-card { padding:15px; border:1px solid var(--border); border-radius:8px; margin-bottom:10px; background:#0d1117; text-align:left; }
        #lockBox { display:none; background:var(--red); color:white; padding:30px; border-radius:12px; margin:20px auto; max-width:500px; font-weight:bold; font-size:1.2em; line-height: 1.5; }
    </style>
</head>
<body>

    <h2 style="color:var(--green);">♻️ Maya GeriKazanım</h2>

    <!-- KİLİT EKRANI -->
    <div id="lockBox">
        🔒 Site Admin Tarafından Kilitlenmiştir.<br>
        Yarışma Sona Ermiştir.<br>
        Katılan Tüm Sınıflara Teşekkür Ederiz.
    </div>

    <!-- ANA SAYFA -->
    <div id="pgLogin" class="pg on">
        <div class="card">
            <h3>Sınıfını Seç</h3>
            <div id="classGrid" class="class-grid"></div>
            <button class="btn" style="background:#21262d; margin-top:20px;" onclick="showPg('rank')">🏆 Mevcut Sıralama</button>
        </div>
    </div>

    <!-- ŞİFRE EKRANI -->
    <div id="pgPw" class="pg">
        <div class="card">
            <h3 id="pwTitle">Giriş</h3>
            <input type="password" id="pwIn" placeholder="Şifre">
            <button class="btn" onclick="checkPw()">Giriş Yap</button>
            <button class="btn" style="background:none; color:#7d8590;" onclick="window.location.href=window.location.origin + window.location.pathname">Vazgeç</button>
        </div>
    </div>

    <!-- SIRALAMA -->
    <div id="pgRank" class="pg">
        <div class="card">
            <h3>🏆 Liderlik Tablosu</h3>
            <div id="rankList">Yükleniyor...</div>
            <button class="btn" onclick="showPg('login')">Geri Dön</button>
        </div>
    </div>

    <!-- KAYIT EKRANI -->
    <div id="pgScan" class="pg">
        <div class="card">
            <h3 id="scanTitle">Kayıt</h3>
            <input type="text" id="bcIn" placeholder="Barkod Numarasını Yazın">
            <input type="file" id="fileIn" accept="image/*" capture="environment" style="display:none;" onchange="handleFile(this)">
            <button class="btn" style="background:#21262d;" onclick="document.getElementById('fileIn').click()">📸 FOTOĞRAF ÇEK</button>
            <img id="preview" class="img-preview">
            <button class="btn" id="sendBtn" onclick="sendToAdmin()" style="margin-top:20px;" disabled>ONAYA GÖNDER</button>
            <button class="btn" style="background:var(--red);" onclick="logoutAndClear()">İptal Et</button>
        </div>
    </div>

    <!-- ADMIN PANELİ -->
    <div id="pgAdmin" class="pg">
        <div class="card">
            <h3>Yönetici Paneli</h3>
            <div id="lockControl" style="margin-bottom:20px; padding:15px; border:2px dashed var(--border); border-radius:10px;">
                <p>Sistem Kilidi Kontrolü:</p>
                <button id="lockToggleBtn" class="btn" onclick="toggleSystemLock()">YÜKLENİYOR...</button>
            </div>
            <div id="adminList"></div>
            <button class="btn" style="background:var(--red); margin-top:20px;" onclick="window.location.href=window.location.origin + window.location.pathname">Güvenli Çıkış</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBmkMyRIBgih2b4nHqA0sVOz7j0m54shbc",
            databaseURL: "https://gerikazanim-90377-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        const SECRETS = {
            '5-A': 'bWF5YTVB', '5-B': 'bWF5YTVC', 
            '6-A': 'bWF5YTZB', '6-B': 'bWF5YTZC', '6-C': 'bWF5YTZD', '6-D': 'bWF5YTZE',
            '7-A': 'bWF5YTdB', '7-B': 'bWF5YTdC',
            'ADMIN': 'bWF5YW1heWE=' // mayamaya
        };

        let isLocked = false;
        let selected = "";
        let currentClass = "";
        let base64Image = "";

        db.ref('system_status/locked').on('value', (s) => {
            isLocked = s.val() || false;
            const lockBox = document.getElementById('lockBox');
            const loginPage = document.getElementById('pgLogin');
            const toggleBtn = document.getElementById('lockToggleBtn');

            if (isLocked) {
                lockBox.style.display = "block";
                loginPage.style.display = "none";
                if(toggleBtn) {
                    toggleBtn.innerText = "SİSTEMİ AÇ";
                    toggleBtn.style.background = "var(--green)";
                }
            } else {
                lockBox.style.display = "none";
                loginPage.style.display = "block";
                if(toggleBtn) {
                    toggleBtn.innerText = "SİSTEMİ KİLİTLE";
                    toggleBtn.style.background = "var(--red)";
                }
            }
        });

        window.onload = function() {
            build();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('admin')) {
                selected = 'ADMIN';
                showPg('pw');
                document.getElementById('pwTitle').innerText = "Yönetici Girişi";
            }
        };

        function toggleSystemLock() {
            const newState = !isLocked;
            const msg = newState ? "Yarışmayı bitirmek ve siteyi kilitlemek istiyor musunuz?" : "Siteyi tekrar açmak istiyor musunuz?";
            if (confirm(msg)) {
                const pass = prompt("Onay için yönetici şifresini girin:");
                if (btoa(pass) === SECRETS['ADMIN']) {
                    db.ref('system_status').set({ locked: newState });
                } else {
                    alert("Hatalı şifre!");
                }
            }
        }

        function checkPw() {
            const val = document.getElementById('pwIn').value.trim();
            if (btoa(val) === SECRETS[selected]) {
                if (selected === 'ADMIN') {
                    showPg('admin');
                } else {
                    if (isLocked) { alert("Site kilitli olduğu için giriş yapılamaz!"); return; }
                    currentClass = selected;
                    logoutAndClear();
                    showPg('scan');
                    document.getElementById('scanTitle').innerText = currentClass + " Kaydı";
                }
                document.getElementById('pwIn').value = "";
            } else {
                alert("Hatalı Şifre!");
            }
        }

        function handleFile(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            document.getElementById('sendBtn').innerText = "Yükleniyor...";
            reader.onloadend = function() {
                base64Image = reader.result;
                document.getElementById('preview').src = base64Image;
                document.getElementById('preview').style.display = "block";
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('sendBtn').innerText = "ONAYA GÖNDER";
            }
            reader.readAsDataURL(file);
        }

        function logoutAndClear() {
            document.getElementById('bcIn').value = "";
            document.getElementById('preview').style.display = "none";
            base64Image = "";
            document.getElementById('sendBtn').disabled = true;
            showPg('login');
        }

        db.ref('scores').on('value', (s) => {
            const data = s.val() || {};
            const list = document.getElementById('rankList');
            const classList = ['5-A','5-B','6-A','6-B','6-C','6-D','7-A','7-B'];
            let arr = classList.map(c => ({name: c, score: Number(data[c] || 0)}));
            arr.sort((a,b) => b.score - a.score);
            list.innerHTML = arr.map((x, i) => `<div class="rank-item"><span><b>#${i+1}</b> ${x.name}</span><span style="color:var(--green); font-weight:bold;">${x.score} Puan</span></div>`).join('');
        });

        db.ref('approvals').on('value', (s) => {
            const data = s.val() || {};
            const list = document.getElementById('adminList');
            const entries = Object.entries(data);
            if(entries.length === 0) { list.innerHTML = "<p style='text-align:center;'>Bekleyen kayıt yok.</p>"; return; }
            list.innerHTML = entries.map(([id, item]) => `
                <div class="admin-card">
                    <p><b>Sınıf:</b> ${item.cls} | <b>Barkod:</b> ${item.bc}</p>
                    <button class="btn" style="background:#21262d; font-size:12px;" onclick="toggleImg('${id}')">🖼️ GÖR</button>
                    <img id="img-${id}" src="${item.img}" class="admin-img" onclick="window.open(this.src)">
                    <div style="display:flex; gap:10px;">
                        <button class="btn" onclick="approve('${id}', '${item.cls}')">✅ OK</button>
                        <button class="btn" style="background:var(--red);" onclick="reject('${id}')">❌ SİL</button>
                    </div>
                </div>`).join('');
        });

        function toggleImg(id) {
            const img = document.getElementById('img-' + id);
            img.style.display = (img.style.display === "block") ? "none" : "block";
        }

        function sendToAdmin() {
            if (isLocked) { alert("Yarışma sona erdi!"); return; }
            const bc = document.getElementById('bcIn').value.trim();
            if (!bc || !base64Image) return alert("Eksik bilgi!");
            db.ref('approvals').push({ cls: currentClass, bc: bc, img: base64Image }).then(() => {
                alert("Onaya gönderildi!");
                logoutAndClear();
            });
        }

        function approve(id, cls) {
            db.ref('scores/' + cls).transaction(c => (c || 0) + 5).then(() => db.ref('approvals/' + id).remove());
        }

        function reject(id) {
            if(confirm("Silinsin mi?")) db.ref('approvals/' + id).remove();
        }

        function build() {
            const g = document.getElementById('classGrid');
            g.innerHTML = "";
            const classList = ['5-A','5-B','6-A','6-B','6-C','6-D','7-A','7-B'];
            classList.forEach(c => {
                const b = document.createElement('button');
                b.className = 'btn'; b.style.background = "#21262d";
                b.innerText = c; b.onclick = () => { selected = c; showPg('pw'); document.getElementById('pwTitle').innerText = c + " Girişi"; };
                g.appendChild(b);
            });
        }

        function showPg(id) { 
            document.querySelectorAll('.pg').forEach(p => p.classList.remove('on')); 
            document.getElementById('pg' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('on'); 
        }
    </script>
</body>
</html>
